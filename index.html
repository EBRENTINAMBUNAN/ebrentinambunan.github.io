<!doctype html>

<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Ebren Tinambunan</title>
    <!-- Typography & Icons -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&amp;family=Playfair+Display:wght@600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link href="assets/css/style.css" rel="stylesheet" />
  </head>
  <body data-page="home">
    <!-- Ambient background shapes -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-grid"></div>
    <main class="shell">
      <!-- HERO -->
      <section class="hero">
        <div class="hero-grid">
          <div class="hero-visual">
            <div class="profile-frame">
              <img
                alt="Foto Ebren Tinambunan"
                class="profile-img"
                src="assets/img/my/ben.png"
              />
              <span class="pulse-ring"></span>
            </div>
            <div class="mini-card">
              <p id="mini-card"></p>
            </div>
          </div>
          <div class="hero-copy">
            <p class="eyebrow">Halo, saya</p>
            <h1 id="hero-name"></h1>
            <p class="lead">
              <span id="typing-text"></span><span id="cursor">|</span>
            </p>
            <p class="body" id="lead-text"></p>
            <div class="cta-row">
              <button class="btn btn-ghost" id="music-btn">
                🎵 Putar Musik
              </button>
            </div>
          </div>
        </div>
      </section>
      <div class="section-block">
        <div class="section-heading">
          <h3>Sertifikat</h3>
          <span class="line"></span>
        </div>
        <div class="certificate-grid" id="certificates"></div>
      </div>
    </main>
    
    <!-- Proyek -->
    <template id="tpl-projects">
      <div class="section-heading" style="margin-bottom: 1.5rem">
        <h2>Proyek</h2>
        <span class="line"></span>
      </div>
      <p class="muted" id="projects-intro" style="margin-bottom: 1.2rem"></p>
      <div class="stats-grid" id="project-stats" style="margin-bottom: 1.2rem"></div>
      <div class="divider"></div>
      <div class="card-grid" id="projects-grid"></div>
    </template>

    <!-- tentang saya -->
    <template id="tpl-about">
      <div class="section-heading" style="margin-bottom: 1.4rem">
        <h2>Tentang Saya</h2>
        <span class="line"></span>
      </div>
      <p class="muted" id="about-intro" style="margin-bottom: 1rem"></p>
      <div class="tools-grid" id="stack-grid" style="margin-top: 0.5rem"></div>
    </template>

    <!-- kontak -->
    <template id="tpl-contact">
      <div class="section-heading" style="margin-bottom: 1.2rem">
        <h2>Kontak</h2>
        <span class="line"></span>
      </div>
      <p class="muted" style="margin-bottom: 1rem">
        Kolaborasi, konsultasi, atau sekadar berdiskusi ide baru.
      </p>
      <div class="info-grid" id="info-grid"></div>
      <div class="contact-grid">
        <div class="contact-card">
          <div class="marquee-container">
            <div class="marquee-text">
              <a href="https://wa.me/6281234567890" target="_blank">
                Klik di sini untuk menghubungi saya lewat WhatsApp sekarang!
              </a>
            </div>
          </div>
          <p class="muted" style="margin-top: 1rem">Ikuti saya</p>
          <div class="social-icons">
            <a
              aria-label="Instagram"
              href="https://instagram.com/ebren_tinambunan"
              target="_blank"
            >
              <i class="fab fa-instagram"></i>
            </a>
            <a
              aria-label="GitHub"
              href="https://github.com/ebrentinambunan"
              target="_blank"
            >
              <i class="fab fa-github"></i>
            </a>
          </div>
        </div>
        <form
          action="mailto:bendev403@gmail.com"
          enctype="text/plain"
          method="POST"
        >
          <div class="form-group">
            <label for="name">Nama</label>
            <input id="name" name="name" required="" type="text" />
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" name="email" required="" type="email" />
          </div>
          <div class="form-group">
            <label for="message">Pesan</label>
            <textarea
              id="message"
              name="message"
              required=""
              rows="5"
            ></textarea>
          </div>
          <button type="submit">Kirim</button>
        </form>
      </div>
    </template>

    <nav class="bottom-nav">
      <a class="active" data-page="home" href="index.html" title="Beranda">
        <span class="material-icons">home</span>
      </a>
      <a data-page="projects" href="index.html" title="Proyek">
        <span class="material-icons">work</span>
      </a>
      <a data-page="about" href="index.html" title="Tentang Saya">
        <span class="material-icons">person</span>
      </a>
      <a data-page="contact" href="index.html" title="Kontak">
        <span class="material-icons">mail</span>
      </a>
    </nav>

    <!-- Modal Video -->
    <div class="modal" id="videoModal">
      <div class="modal-content">
        <span class="close">×</span>
        <div class="video-wrapper">
          <iframe
            allowfullscreen=""
            frameborder="0"
            height="315"
            id="modal-video"
            src=""
            width="100%"
          ></iframe>
        </div>
      </div>
    </div>

    <!-- Modal Sertifikat -->
    <div class="modal" id="certificateModal">
      <div class="modal-content">
        <span class="close-cert">×</span>
        <img
          alt="Preview Sertifikat"
          id="modal-cert-img"
          src=""
          style="width: 100%; height: auto; border-radius: 12px"
        />
      </div>
    </div>

    <audio id="bg-music" loop="">
      <source src="assets/mp3/home.mp3" type="audio/mpeg" />
    </audio>

    <script
      crossorigin="anonymous"
      src="https://kit.fontawesome.com/3f8ab955ad.js"
    ></script>
    
    <script src="assets/js/script.js"></script>
  </body>
</html>
